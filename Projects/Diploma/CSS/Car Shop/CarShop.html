<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Shop Website</title>
    <link rel="stylesheet" href="Style.css">
    <script>
        function validateLogin(event) {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            document.getElementById('error-message').innerText = '';

            if (!emailPattern.test(email)) {
                document.getElementById('error-message').innerText = 'Please enter a valid email address.';
                event.preventDefault();
                return false;
            }

            if (password.length < 6) {
                document.getElementById('error-message').innerText = 'Password must be at least 6 characters long.';
                event.preventDefault();
                return false;
            }

            return true;
        }
    </script>
</head>
<body>
    <div class="main">
        <nav>
            <div class="logo">
                <h3>Cars Shop</h3>
            </div>
            <div class="nav-links">
                <a href="#">Explore Cars</a>
                <div>
                    <a href="#">Our Services</a>
                    <a class="btn" href="#">About</a>
                </div>
            </div>
        </nav>
        <div class="content">
            <h1>Buy the Best <br> Quality Cars</h1>
            <div class="search">
                <input type="text" placeholder="Search Any Car" aria-label="Search for cars">
                <button type="submit">Search</button>
            </div>
        </div>
    </div>
    
    <div class="form">
        <h2>Login</h2>
        <form onsubmit="return validateLogin(event);">
            <div class="box">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
                
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" placeholder="Password" required>
            </div>
            <div id="error-message" style="color: red;"></div>
            <div class="link">
                <button type="submit">Log In</button>
            </div>
            <div class="link">
                <a href="#">Forgot Password?</a>
            </div>
            <div class="link">
                <a href="#">Create New Account</a>
            </div>
        </form>
    </div>
</body>
</html>
